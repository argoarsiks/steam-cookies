repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uvx ruff check --fix
        language: system
        types: [python]
        exclude: ^steam_cookies/pb2/

      - id: mypy
        name: mypy
        entry: uv run --with mypy mypy steam_cookies
        language: system
        types: [python]
        exclude: ^steam_cookies/pb2/
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
